apiVersion: apps/v1
kind: Deployment
metadata:
    name: quiz
spec:
    replicas: 2
    selector:
        matchLabels:
            run: quiz
    template:
        metadata:
            labels:
                run: quiz
        spec:
            containers:
            - name: quiz
              image: mathora-quiz:v1
---
apiVersion: v1
kind: Service
metadata:
    name: quiz
spec:
    selector:
        run: quiz
    ports:
    - port: 8000
