apiVersion: apps/v1
kind: Deployment
metadata:
    name: quiz
spec:
    replicas: 2
    selector:
        matchLabels:
            run: quiz
    template:
        metadata:
            labels:
                run: quiz
        spec:
            containers:
            - name: quiz
              image: mathora-quiz:v1
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "5"]
              env:
              - name: DATABASE_URL
                value: postgresql://mathora:mathora@database:5432/mathora
              - name: ACCOUNT_URL
                value: http://account:8000
              - name: QUESTION_URL
                value: http://question:8000
              - name: ANSWER_URL
                value: http://answer:8000
              - name: PROGRESS_URL
                value: http://progress:8000
---
apiVersion: v1
kind: Service
metadata:
    name: quiz
spec:
    selector:
        run: quiz
    ports:
    - port: 8000
