apiVersion: apps/v1
kind: Deployment
metadata:
    name: progress
spec:
    replicas: 2
    selector:
        matchLabels:
            run: progress
    template:
        metadata:
            labels:
                run: progress
        spec:
            containers:
            - name: progress
              image: mathora-progress:v1
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "5"]
              env:
              - name: DATABASE_URL
                value: postgresql://mathora:mathora@database:5432/mathora
              - name: ACCOUNT_URL
                value: http://account:8000
---
apiVersion: v1
kind: Service
metadata:
    name: progress
spec:
    selector:
        run: progress
    ports:
    - port: 8000
