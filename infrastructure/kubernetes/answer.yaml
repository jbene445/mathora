apiVersion: apps/v1
kind: Deployment
metadata:
    name: answer
spec:
    replicas: 2
    selector:
        matchLabels:
            run: answer
    template:
        metadata:
            labels:
                run: answer
        spec:
            containers:
            - name: answer
              image: mathora-answer:v1
---
apiVersion: v1
kind: Service
metadata:
    name: answer
spec:
    selector:
        run: answer
    ports:
    - port: 8000
