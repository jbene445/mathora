apiVersion: apps/v1
kind: Deployment
metadata:
    name: answer
spec:
    replicas: 2
    selector:
        matchLabels:
            run: answer
    template:
        metadata:
            labels:
                run: answer
        spec:
            containers:
            - name: answer
              image: mathora-answer:v1
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "5"]
              env:
              - name: DATABASE_URL
                value: postgresql://mathora:mathora@database:5432/mathora
              - name: SOLVER_URL
                value: http://solver:8000
              - name: PROGRESS_URL
                value: http://progress:8000
---
apiVersion: v1
kind: Service
metadata:
    name: answer
spec:
    selector:
        run: answer
    ports:
    - port: 8000
