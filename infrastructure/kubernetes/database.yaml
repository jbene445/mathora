# Permanent storage: data survives pod restarts. SQL files only load into an empty disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: database
spec:
    accessModes:
    - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: database
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            run: database
    template:
        metadata:
            labels:
                run: database
        spec:
            containers:
            - name: database
              image: mathora-database:v1
              env:
              - name: POSTGRES_DB
                value: mathora
              - name: POSTGRES_USER
                value: mathora
              - name: POSTGRES_PASSWORD
                value: mathora
              - name: PGDATA
                value: /var/lib/postgresql/data/pgdata
              volumeMounts:
              - name: data
                mountPath: /var/lib/postgresql/data
            volumes:
            - name: data
              persistentVolumeClaim:
                  claimName: database
---
apiVersion: v1
kind: Service
metadata:
    name: database
spec:
    selector:
        run: database
    ports:
    - port: 5432
