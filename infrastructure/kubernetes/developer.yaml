apiVersion: apps/v1
kind: Deployment
metadata:
    name: developer
spec:
    replicas: 2
    selector:
        matchLabels:
            run: developer
    template:
        metadata:
            labels:
                run: developer
        spec:
            containers:
            - name: developer
              image: mathora-developer:v1
              readinessProbe:
                httpGet:
                  path: /
                  port: 80
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
    name: developer
spec:
    type: LoadBalancer
    selector:
        run: developer
    ports:
    - port: 80
