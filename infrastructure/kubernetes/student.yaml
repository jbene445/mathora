apiVersion: apps/v1
kind: Deployment
metadata:
    name: student
spec:
    replicas: 2
    selector:
        matchLabels:
            run: student
    template:
        metadata:
            labels:
                run: student
        spec:
            containers:
            - name: student
              image: mathora-student:v1
              readinessProbe:
                httpGet:
                  path: /
                  port: 80
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
    name: student
spec:
    type: LoadBalancer
    selector:
        run: student
    ports:
    - port: 80
