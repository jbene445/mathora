apiVersion: apps/v1
kind: Deployment
metadata:
    name: question
spec:
    replicas: 2
    selector:
        matchLabels:
            run: question
    template:
        metadata:
            labels:
                run: question
        spec:
            containers:
            - name: question
              image: mathora-question:v1
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "5"]
              env:
              - name: DATABASE_URL
                value: postgresql://mathora:mathora@database:5432/mathora
---
apiVersion: v1
kind: Service
metadata:
    name: question
spec:
    selector:
        run: question
    ports:
    - port: 8000
