server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/account/    { proxy_pass http://account:8000/; }
    location /api/answer/     { proxy_pass http://answer:8000/; }
    location /api/curriculum/ { proxy_pass http://curriculum:8000/; }
    location /api/progress/   { proxy_pass http://progress:8000/; }
    location = /api/progress/attempts { return 403; }
    location /api/question/   { proxy_pass http://question:8000/; }
    location /api/quiz/       { proxy_pass http://quiz:8000/; }
    location /api/solver/     { proxy_pass http://solver:8000/; }
}
