limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/answer/     { include api.conf; proxy_pass http://answer:8000/; }
    location /v1/curriculum/ { include api.conf; proxy_pass http://curriculum:8000/; }
    location /v1/question/   { include api.conf; proxy_pass http://question:8000/; }
    location /v1/solver/     { include api.conf; proxy_pass http://solver:8000/; }
    location /v1/ {
        default_type application/json;
        return 404 '{"detail": "Not found"}';
    }
}
